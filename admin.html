<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réservation manuelle - L'Échappée Verte</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f8f4;
      padding: 20px;
      color: #2f4f35;
    }

    .admin {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
    }

    h1 {
      text-align: center;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      margin-top: 5px;
      box-sizing: border-box;
    }

    button {
      margin-top: 25px;
      background: #357a46;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 17px;
    }

    #message {
      margin-top: 20px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="admin">
  <h1>🌿 L'Échappée Verte</h1>
  <h2>Bloquer des dates</h2>

  <label>Logement</label>
  <select id="logement">
    <option value="Maison">Maison</option>
    <option value="Studio">Studio</option>
  </select>

  <label>Date d'arrivée</label>
  <input type="date" id="arrivee">

  <label>Date de départ</label>
  <input type="date" id="depart">

  <label>Nom du client</label>
  <input type="text" id="nom">

  <button type="button" onclick="bloquerDates()">
    Bloquer les dates
  </button>
  <button type="button" onclick="debloquerDates()">
  Débloquer les dates
</button>
<h2 style="margin-top:30px;">📅 Disponibilités</h2>

<select id="calendrier-logement">
  <option value="Maison">Maison</option>
  <option value="Studio">Studio</option>
</select>

<div class="navigation-mois" style="display:flex;gap:10px;align-items:center;margin-top:15px;">
  <button type="button" id="mois-precedent">◀</button>
  <h3 id="calendrier-mois" style="flex:1;text-align:center;"></h3>
  <button type="button" id="mois-suivant">▶</button>
</div>

<div id="calendrier-admin" style="
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
  margin-top:15px;
"></div>

<div style="margin-top:15px;text-align:center;">
  🟢 Disponible &nbsp;&nbsp; 🔴 Réservé
</div>
  
  <div id="message"></div>
</div>

<script>
async function bloquerDates() {
  const logement = document.getElementById("logement").value;
  const arrivee = document.getElementById("arrivee").value;
  const depart = document.getElementById("depart").value;
  const nom = document.getElementById("nom").value;
  const message = document.getElementById("message");

  if (!arrivee || !depart || !nom) {
    message.textContent = "Merci de remplir tous les champs.";
    return;
  }

  if (depart <= arrivee) {
    message.textContent = "La date de départ doit être après l'arrivée.";
    return;
  }

  try {
    const response = await fetch("/reservations", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        logement: logement,
        arrivee: arrivee,
        depart: depart,
        nom: nom,
        email: "reservation-manuelle@echappee-verte.fr",
        paiement: "Espèces",
        manuel: true
      })
    });

    const resultat = await response.json();

    if (response.ok && resultat.success) {
      message.textContent = "✅ Dates bloquées avec succès.";
    } else {
      message.textContent = "❌ " + (resultat.message || "Impossible de bloquer ces dates.");
    }
  } catch (erreur) {
    message.textContent = "❌ Erreur lors de l'enregistrement.";
  }
}
  async function debloquerDates() {
  const logement = document.getElementById("logement").value;
  const arrivee = document.getElementById("arrivee").value;
  const depart = document.getElementById("depart").value;
  const message = document.getElementById("message");

  if (!arrivee || !depart) {
    message.textContent = "❌ Choisis les dates à débloquer.";
    return;
  }

  try {
    const response = await fetch("/reservations", {
      method: "DELETE",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        logement: logement,
        arrivee: arrivee,
        depart: depart
      })
    });

    const resultat = await response.json();

    if (response.ok && resultat.success) {
      message.textContent = "✅ Réservation supprimée, dates débloquées.";
      await afficherCalendrierAdmin();
    } else {
      message.textContent = "❌ " + (resultat.message || "Impossible de débloquer ces dates.");
    }
  } catch (erreur) {
    message.textContent = "❌ Erreur lors du déblocage.";
  }
  }
  async function debloquerDates() {
  const logement = document.getElementById("logement").value;
  const arrivee = document.getElementById("arrivee").value;
  const depart = document.getElementById("depart").value;
  const message = document.getElementById("message");

  if (!arrivee || !depart) {
    message.textContent = "❌ Choisis les dates à débloquer.";
    return;
  }

  try {
    const response = await fetch("/reservations", {
      method: "DELETE",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        logement: logement,
        arrivee: arrivee,
        depart: depart
      })
    });

    const resultat = await response.json();

    if (response.ok && resultat.success) {
      message.textContent = "✅ Dates débloquées avec succès.";
    } else {
      message.textContent = "❌ " + (resultat.message || "Impossible de débloquer.");
    }
  } catch (erreur) {
    message.textContent = "❌ Erreur lors du déblocage.";
  }
  }
  let moisAdmin = new Date();

async function afficherCalendrierAdmin() {
  const grille = document.getElementById("calendrier-admin");
  const titre = document.getElementById("calendrier-mois");
  const logement = document.getElementById("calendrier-logement").value;

  grille.innerHTML = "";

  const annee = moisAdmin.getFullYear();
  const mois = moisAdmin.getMonth();

  titre.textContent = new Intl.DateTimeFormat("fr-FR", {
    month: "long",
    year: "numeric"
  }).format(moisAdmin);

  let reservations = [];

  try {
    const response = await fetch("/reservations?logement=" + encodeURIComponent(logement));
    const resultat = await response.json();
    reservations = Array.isArray(resultat) ? resultat : (resultat.reservations || []);
  } catch (erreur) {
    console.error(erreur);
  }

  const premierJour = new Date(annee, mois, 1);
  let decalage = premierJour.getDay();
  decalage = decalage === 0 ? 6 : decalage - 1;

  for (let i = 0; i < decalage; i++) {
    grille.appendChild(document.createElement("div"));
  }

  const nombreJours = new Date(annee, mois + 1, 0).getDate();

  for (let jour = 1; jour <= nombreJours; jour++) {
    const date = `${annee}-${String(mois + 1).padStart(2,"0")}-${String(jour).padStart(2,"0")}`;

    const reserve = reservations.some(r =>
      r.logement === logement &&
      date >= r.arrivee &&
      date < r.depart
    );

    const caseJour = document.createElement("div");
    caseJour.textContent = jour;
    caseJour.style.padding = "10px 2px";
    caseJour.style.textAlign = "center";
    caseJour.style.borderRadius = "8px";
    caseJour.style.fontWeight = "bold";
caseJour.style.background = reserve ? "#e53935" : "#66bb6a";
caseJour.style.color = reserve ? "white" : "#17351f";

grille.appendChild(caseJour);
  }
}

document.getElementById("mois-precedent").onclick = () => {
  moisAdmin.setMonth(moisAdmin.getMonth() - 1);
  afficherCalendrierAdmin();
};

document.getElementById("mois-suivant").onclick = () => {
  moisAdmin.setMonth(moisAdmin.getMonth() + 1);
  afficherCalendrierAdmin();
};

document.getElementById("calendrier-logement").onchange = afficherCalendrierAdmin;

afficherCalendrierAdmin();
</script>


</body>
</html>
