<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L'Échappée Verte – Réservation</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f6f3e8;
  color: #29452d;
}
header {
  background: #557a46;
  color: white;
  text-align: center;
  padding: 28px 15px;
}
header h1 {
  margin: 0;
  font-size: 32px;
}
header p {
  margin-bottom: 0;
}
main {
  max-width: 650px;
  margin: auto;
  padding: 18px;
}
.card {
  background: white;
  border-radius: 18px;
  padding: 20px;
  margin: 18px 0;
  box-shadow: 0 3px 12px #0002;
}
.price {
  font-size: 22px;
  font-weight: bold;
  color: #557a46;
}
label {
  display: block;
  margin-top: 14px;
  font-weight: bold;
}
input , select ,text area {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  box-sizing: border-box;
  border: 1px solid #bbb;
  border-radius: 10px;
  font-size: 16px;
}
  input[type=date"] {
    appearance: auto;
    -webkit-appearance: auto ;
  }
button {
  width: 100%;
  margin-top: 20px;
  padding: 15px;
  border: 0;
  border-radius: 12px;
  background: #557a46;
  color: white;
  font-size: 18px;
  font-weight: bold;
}
footer {
  text-align: center;
  padding: 25px;
}
/* Calendrier des disponibilités */
.calendrier {
  background: white;
  border-radius: 16px;
  padding: 15px;
  margin: 20px 0;
}

.calendrier-grille {
  display: grid !important;
  grid-template-columns: repeat(7, minmax(0, 1fr)) !important;
  gap: 5px;
  width: 100%;
  overflow: hidden;
}

.calendrier-grille > div {
  min-width: 0;
}
  .navigation-mois {
  display: flex !important;
align-items: center !important;
  justify-content: space-between !important;
  gap: 10px;
  margin: 15px 0;
}

.navigation-mois h3 {
  margin: 0;
  text-align: center;
  flex: 1;
}

.navigation-mois button {
  width: 45px;
  height: 40px;
  padding: 0;
  border: 0;
  border-radius: 8px;
  cursor: pointer;
}

.jour {
  text-align: center;
  padding: 9px 0;
  border-radius: 8px;
  background-color: #8fd694 !important;
  color: #17351c !important;
  font-weight: bold;
}

.jour.reserve {
  background-color: #e53935 !important;
  color: white !important;
}

.legende {
  margin-top: 12px;
  font-size: 14px;
}  
</style>
</head>

<body>

<header>
  <h1>🌿 L'Échappée Verte 🌿</h1>
  <p>Gîtes • Carsac-de-Gurçon</p>
</header>

<main>

<div class="card">
  <h2>🏡 La Maison</h2>
  <p>Maison avec 3 chambres</p>
  <div class="price">200 € / nuit</div>
</div>

<div class="card">
  <h2>🌸 Le Studio</h2>
  <p>Un séjour confortable au cœur de la Dordogne</p>
  <div class="price">65 € / nuit</div>
</div>

<div class="card">
  <div class="calendrier">
  <h2>📅 Disponibilités</h2>

  <select id="calendrier-logement">
    <option value="Maison">Maison – 200 € / nuit</option>
    <option value="Studio">Studio – 65 € / nuit</option>
  </select>

  <div class="navigation-mois" style="display:flex !important; align-items:center !important; justify-content:space-between !important; width:100% !important; gap:10px;">
  <button type="button" id="mois-precedent" style="width:45px !important; margin:0 !important;">◀</button>
  <h3 id="calendrier-mois" style="flex:1; text-align:center; margin:0;"></h3>
  <button type="button" id="mois-suivant" style="width:45px !important; margin:0 !important;">▶</button>
</div>

  <div class="calendrier-grille" id="calendrier-grille"></div>

  <div class="legende">
    🟢 Disponible &nbsp;&nbsp; 🔴 Réservé
  </div>
  </div>
  <h2>📅 Demande de réservation</h2>

  <form id="reservationForm">
    <input type="hidden" name="_template" value="table">
    <input type="hidden" name="_subject" value="🌿 Nouvelle réservation - L'Échappée Verte">
    <label>Logement</label>
    <select id="logement" name="Logement" required>
  <option value="Maison">Maison - 200 € / nuit</option>
  <option value="Studio">Studio - 65 € / nuit</option>
</select>

    <label>Date d'arrivée</label>
    <input type="date" id="arrivee" name="Date arrivée" required>

    <label>Date de départ</label>
    <input type="date" id="depart" name="Date départ" required>

    <label>Nom et prénom</label>
    <input type="text" id="nom" name="Non et prénom " required>

    <label>Téléphone</label>
    <input type="tel" id="téléphone" name="Téléphone" required>

    <label>E-mail</label>
    <input type="email" name="Email" required>

    <label>Message</label>
    <textarea rows="4" name="Message"></textarea>
<input type="hidden" id="montantEmail" name="Montant total" value="">
    <button type="submit">🌿 Demander une réservation</button>
  </form>
</div>
  

</main>

<footer>
  L'Échappée Verte<br>
  Carsac-de-Gurçon • Dordogne
</footer>
<script>
const form = document.querySelector("form");
const logement = form.querySelector("select");
const dates = form.querySelectorAll('input[type="date"]');

const total = document.createElement("div");
total.style.marginTop = "20px";
total.style.fontSize = "22px";
total.style.fontWeight = "bold";
total.style.color = "#557a46";
total.style.textAlign = "center";
total.innerHTML = "Sélectionnez vos dates pour calculer le prix";
form.insertBefore(total, form.querySelector("button"));

function calculerPrix() {
  const arrivee = dates[0].value;
  const depart = dates[1].value;

  if (!arrivee || !depart) return;

  const debut = new Date(arrivee);
  const fin = new Date(depart);
  const nuits = Math.round((fin - debut) / 86400000);

  if (nuits <= 0) {
    total.innerHTML = "⚠️ La date de départ doit être après l'arrivée";
    return;
  }

  const prixNuit = logement.selectedIndex === 0 ? 200 : 65;
  const montant = nuits * prixNuit;
document.getElementById("montantEmail").value = montant + " €";
  total.innerHTML =
    "🌿 " + nuits + " nuit" + (nuits > 1 ? "s" : "") +
    " × " + prixNuit + " €<br>" +
    "Total du séjour : " + montant + " €";
}

logement.addEventListener("change", calculerPrix);
dates[0].addEventListener("change", calculerPrix);
dates[1].addEventListener("change", calculerPrix);
 form.addEventListener("submit", async function(e) {
  e.preventDefault();

const reservation = {
  logement: document.getElementById("logement").value,
  arrivee: document.getElementById("arrivee").value,
  depart: document.getElementById("depart").value,
  nom: document.getElementById("nom").value,
  telephone: form.querySelector('input[type="tel"]').value,
  email: form.querySelector('input[type="email"]').value,
  message: form.querySelector("textarea").value
};

  try {
    const reponse = await fetch("/check-availability", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(reservation)
    });

    const resultat = await reponse.json();

    if (!reponse.ok) {
      alert(resultat.message || "Ces dates ne sont pas disponibles.");
      return;
    }

  const paiement = await fetch("/create-checkout", {
  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify(reservation)
});

const resultatPaiement = await paiement.json();

if (!paiement.ok || !resultatPaiement.paymentUrl) {
  alert(resultatPaiement.message || "Impossible de créer le paiement SumUp.");
  return;
}

alert("✅ Vos dates sont disponibles. Vous allez être redirigé vers le paiement sécurisé SumUp.");
  sessionStorage.setItem("reservationEnAttente", JSON.stringify(reservation));
sessionStorage.setItem("sumupCheckoutId", resultatPaiement.checkoutId);  
    window.location.href = resultatPaiement.paymentUrl;
  } catch (erreur) {
    alert("Erreur lors de la réservation. Merci de réessayer.");
  }
}); 
  let dateCalendrier = new Date();
  async function chargerCalendrier() {
  const logement = document.getElementById("calendrier-logement").value;
  const grille = document.getElementById("calendrier-grille");
  const titre = document.getElementById("calendrier-mois");

  const maintenant = dateCalendrier;
  const annee = maintenant.getFullYear();
  const mois = maintenant.getMonth();

  titre.textContent = maintenant.toLocaleDateString("fr-FR", {
    month: "long",
    year: "numeric"
  });

  try {
    const reponse = await fetch("/reservations");
    const reservations = await reponse.json();

    grille.innerHTML = "";
grille.style.display = "grid";
grille.style.gridTemplateColumns = "repeat(7, 1fr)";
grille.style.gap = "5px";
    
    const premierJour = new Date(annee, mois, 1);
    const dernierJour = new Date(annee, mois + 1, 0);

    let decalage = premierJour.getDay();
    decalage = decalage === 0 ? 6 : decalage - 1;

    for (let i = 0; i < decalage; i++) {
      grille.innerHTML += "<div></div>";
    }

    for (let jour = 1; jour <= dernierJour.getDate(); jour++) {
      const dateISO =
        annee + "-" +
        String(mois + 1).padStart(2, "0") + "-" +
        String(jour).padStart(2, "0");

      const reserve = reservations.some(r =>
        r.logement === logement &&
        dateISO >= r.arrivee &&
        dateISO < r.depart
      );

      const caseJour = document.createElement("div");
      caseJour.className = reserve ? "jour reserve" : "jour";
      caseJour.textContent = jour;
      caseJour.style.textAlign = "center";
caseJour.style.padding = "9px 0";
caseJour.style.borderRadius = "8px";
caseJour.style.fontWeight = "bold";
caseJour.style.backgroundColor = reserve ? "#e53935" : "#8fd694";
caseJour.style.color = reserve ? "white" : "#17351c";
      grille.appendChild(caseJour);
    }
  } catch (erreur) {
    grille.innerHTML = "Impossible de charger les disponibilités.";
  }
}

document
  .getElementById("calendrier-logement")
  .addEventListener("change", chargerCalendrier);

  document.getElementById("mois-precedent").addEventListener("click", () => {
  dateCalendrier.setMonth(dateCalendrier.getMonth() - 1);
  chargerCalendrier();
});

document.getElementById("mois-suivant").addEventListener("click", () => {
  dateCalendrier.setMonth(dateCalendrier.getMonth() + 1);
  chargerCalendrier();
});
async function verifierRetourPaiement() {
  const params = new URLSearchParams(window.location.search);

  if (params.get("paiement") !== "retour") return;

  const checkoutId = sessionStorage.getItem("sumupCheckoutId");
  const reservation = JSON.parse(
    sessionStorage.getItem("reservationEnAttente") || "null"
  );

  if (!checkoutId || !reservation) {
    alert("Impossible de vérifier le paiement.");
    return;
  }

  try {
    const reponse = await fetch(
      "/check-payment?checkoutId=" + encodeURIComponent(checkoutId)
    );

    const resultat = await reponse.json();

    if (resultat.success && resultat.paid) {
      const confirmation = await fetch("/reservations", {
  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify(reservation)
});

const resultatConfirmation = await confirmation.json();

if (!confirmation.ok) {
  alert(resultatConfirmation.message || "Paiement accepté, mais erreur lors de l'enregistrement de la réservation.");
  return;
}
      alert("✅ Paiement accepté. Votre réservation est confirmée.");
      sessionStorage.removeItem("sumupCheckoutId");
      sessionStorage.removeItem("reservationEnAttente");
      window.history.replaceState({}, "", window.location.pathname);
    } else {
      alert("⚠️ Le paiement n'a pas été validé. Votre réservation n'est pas confirmée.");
    }
  } catch (erreur) {
    alert("Impossible de vérifier le paiement SumUp.");
  }
}

verifierRetourPaiement();
  chargerCalendrier();
</script>

</body>
</html>
