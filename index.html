<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L'Échappée Verte – Réservation</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f6f3e8;
  color: #29452d;
}
header {
  background: #557a46;
  color: white;
  text-align: center;
  padding: 28px 15px;
}
header h1 {
  margin: 0;
  font-size: 32px;
}
header p {
  margin-bottom: 0;
}
main {
  max-width: 650px;
  margin: auto;
  padding: 18px;
}
.card {
  background: white;
  border-radius: 18px;
  padding: 20px;
  margin: 18px 0;
  box-shadow: 0 3px 12px #0002;
}
.price {
  font-size: 22px;
  font-weight: bold;
  color: #557a46;
}
label {
  display: block;
  margin-top: 14px;
  font-weight: bold;
}
input , select ,text area {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  box-sizing: border-box;
  border: 1px solid #bbb;
  border-radius: 10px;
  font-size: 16px;
}
  input[type=date"] {
    appearance: auto;
    -webkit-appearance: auto ;
  }
button {
  width: 100%;
  margin-top: 20px;
  padding: 15px;
  border: 0;
  border-radius: 12px;
  background: #557a46;
  color: white;
  font-size: 18px;
  font-weight: bold;
}
footer {
  text-align: center;
  padding: 25px;
}
</style>
</head>

<body>

<header>
  <h1>🌿 L'Échappée Verte 🌿</h1>
  <p>Gîtes • Carsac-de-Gurçon</p>
</header>

<main>

<div class="card">
  <h2>🏡 La Maison</h2>
  <p>Maison avec 3 chambres</p>
  <div class="price">200 € / nuit</div>
</div>

<div class="card">
  <h2>🌸 Le Studio</h2>
  <p>Un séjour confortable au cœur de la Dordogne</p>
  <div class="price">65 € / nuit</div>
</div>

<div class="card">
  <h2>📅 Demande de réservation</h2>

  <form action="https://formsubmit.co/echappee.verte.24610@gmail.com" method="POST">
    <label>Logement</label>
    <select id="logement" name="Logement" required>
  <option value="Maison">Maison - 200 € / nuit</option>
  <option value="Studio">Studio - 65 € / nuit</option>
</select>

    <label>Date d'arrivée</label>
    <input type="date" id="arrivee" name="Date arrivée" required>

    <label>Date de départ</label>
    <input type="date" id="depart" name="Date départ" required>

    <label>Nom et prénom</label>
    <input type="text" id="nom" name="Non et prénom " required>

    <label>Téléphone</label>
    <input type="tel" id="téléphone" name="Téléphone" required>

    <label>E-mail</label>
    <input type="email" name="Email" required>

    <label>Message</label>
    <textarea rows="4" name="Message"></textarea>
<input type="hidden" id="montantEmail" name="Montant total" value="">
    <button type="submit">🌿 Demander une réservation</button>
  </form>
</div>

</main>

<footer>
  L'Échappée Verte<br>
  Carsac-de-Gurçon • Dordogne
</footer>
<script>
const form = document.querySelector("form");
const logement = form.querySelector("select");
const dates = form.querySelectorAll('input[type="date"]');

const total = document.createElement("div");
total.style.marginTop = "20px";
total.style.fontSize = "22px";
total.style.fontWeight = "bold";
total.style.color = "#557a46";
total.style.textAlign = "center";
total.innerHTML = "Sélectionnez vos dates pour calculer le prix";
form.insertBefore(total, form.querySelector("button"));

function calculerPrix() {
  const arrivee = dates[0].value;
  const depart = dates[1].value;

  if (!arrivee || !depart) return;

  const debut = new Date(arrivee);
  const fin = new Date(depart);
  const nuits = Math.round((fin - debut) / 86400000);

  if (nuits <= 0) {
    total.innerHTML = "⚠️ La date de départ doit être après l'arrivée";
    return;
  }

  const prixNuit = logement.selectedIndex === 0 ? 200 : 65;
  const montant = nuits * prixNuit;
document.getElementById("montantEmail").value = montant + " €";
  total.innerHTML =
    "🌿 " + nuits + " nuit" + (nuits > 1 ? "s" : "") +
    " × " + prixNuit + " €<br>" +
    "Total du séjour : " + montant + " €";
}

logement.addEventListener("change", calculerPrix);
dates[0].addEventListener("change", calculerPrix);
dates[1].addEventListener("change", calculerPrix);
 form.addEventListener("submit", async function(e) {
  e.preventDefault();

  const reservation = {
    logement: document.getElementById("logement").value,
    arrivee: document.getElementById("arrivee").value,
    depart: document.getElementById("depart").value
  };

  try {
    const reponse = await fetch("/reservations", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(reservation)
    });

    const resultat = await reponse.json();

    if (!reponse.ok) {
      alert(resultat.message || "Ces dates ne sont pas disponibles.");
      return;
    }

    form.submit();
  } catch (erreur) {
    alert("Erreur lors de la réservation. Merci de réessayer.");
  }
}); 
</script>

</body>
</html>
